<canvas id="scene"></canvas>

<!-- Экран запуска. За ним по-настоящему едет машина. -->
<div id="title">
  <div class="title-top">
    <h1>Тихие холмы</h1>
    <p class="tagline">холмы · монеты · шахты в долине</p>
  </div>
  <div class="title-bottom">
    <button id="btn-play" class="btn main go"><svg class="i"><use href="#i-play"/></svg>Играть</button>
    <p id="title-stats" class="title-stats" hidden></p>
    <div class="title-row">
      <button id="btn-title-sound" class="icon-btn" title="Музыка" aria-label="Музыка"><svg class="i"><use href="#i-sound"/></svg></button>
      <button id="btn-title-settings" class="icon-btn" title="Настройки" aria-label="Настройки"><svg class="i"><use href="#i-settings"/></svg></button>
    </div>
  </div>
</div>

<div id="fade"></div>

<header id="top">
  <div class="res"><svg class="i"><use href="#i-coin"/></svg><b id="coins">0</b></div>
  <div class="res"><svg class="i"><use href="#i-ore"/></svg><b id="ore">0</b></div>
  <div class="spacer"></div>
  <button id="btn-sound" class="icon-btn" title="Музыка" aria-label="Музыка"><svg class="i"><use href="#i-sound"/></svg></button>
  <button id="btn-settings" class="icon-btn" title="Настройки" aria-label="Настройки"><svg class="i"><use href="#i-settings"/></svg></button>
</header>

<button id="pending" hidden></button>

<!-- Низ экрана разложен по смыслу: слева то, во что вкладываешь,
     по центру главное действие, справа цели. -->
<nav id="base-bar">
  <div class="bar-zone left">
    <button id="btn-garage" class="btn"><svg class="i"><use href="#i-garage"/></svg>Гараж</button>
    <button id="btn-shop" class="btn"><svg class="i"><use href="#i-shop"/></svg>Магазин</button>
  </div>
  <button id="btn-ride" class="btn main go"><svg class="i"><use href="#i-play"/></svg>Поехать</button>
  <div class="bar-zone right">
    <button id="btn-quests" class="btn"><svg class="i"><use href="#i-quests"/></svg>Задания<b id="quest-badge" hidden>0</b></button>
  </div>
</nav>

<div id="ride-hud" hidden>
  <!-- Слева расход, по центру главное число, справа заработок и пауза -->
  <div id="ride-top">
    <div class="hud-zone left">
      <div id="fuel-wrap"><i id="fuel-bar"></i></div>
      <span class="hud-cap">топливо</span>
    </div>
    <div class="hud-zone center">
      <span id="dist">0 м</span>
    </div>
    <div class="hud-zone right">
      <span class="run-coins"><svg class="i"><use href="#i-coin"/></svg><span id="run-coins">0</span></span>
      <button id="btn-pause" class="icon-btn" title="Пауза" aria-label="Пауза"><svg class="i"><use href="#i-pause"/></svg></button>
    </div>
  </div>
  <div id="pedals">
    <button id="pedal-brake" class="pedal" aria-label="Тормоз">&#9664;</button>
    <button id="pedal-gas" class="pedal" aria-label="Газ">&#9654;</button>
  </div>
</div>

<div id="modal" hidden>
  <div class="sheet">
    <header><h2 id="modal-title"></h2><button id="modal-close" aria-label="Закрыть">&times;</button></header>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>
